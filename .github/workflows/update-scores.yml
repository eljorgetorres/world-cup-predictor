name: Update World Cup scores

on:
  schedule:
    # AUTO-GENERATED by scripts/generate-update-cron.mjs — do not edit schedule by hand.
    # Generated: 2026-06-25T15:18:41.822Z
    # Regenerate after schedule changes: node scripts/generate-update-cron.mjs
    # Per-match: kickoff + 2h15m UTC. GitHub cron is best-effort (may drift ±few min).
    - cron: '15 22 25 6 *'  # GER-ECU, CIV-CUW (kickoff 2026-06-25T20:00:00Z) → ~Jun 25, 6:15 PM EDT
    - cron: '15 1 26 6 *'  # NED-TUN, SWE-JPN (kickoff 2026-06-25T23:00:00Z) → ~Jun 25, 9:15 PM EDT
    - cron: '15 4 26 6 *'  # USA-TUR, AUS-PAR (kickoff 2026-06-26T02:00:00Z) → ~Jun 26, 12:15 AM EDT
    - cron: '15 21 26 6 *'  # FRA-NOR, SEN-IRQ (kickoff 2026-06-26T19:00:00Z) → ~Jun 26, 5:15 PM EDT
    - cron: '15 2 27 6 *'  # ESP-URU, KSA-CPV (kickoff 2026-06-27T00:00:00Z) → ~Jun 26, 10:15 PM EDT
    - cron: '15 5 27 6 *'  # EGY-IRN, BEL-NZL (kickoff 2026-06-27T03:00:00Z) → ~Jun 27, 1:15 AM EDT
    - cron: '15 23 27 6 *'  # PAN-ENG, CRO-GHA (kickoff 2026-06-27T21:00:00Z) → ~Jun 27, 7:15 PM EDT
    - cron: '45 1 28 6 *'  # COL-POR, DRC-UZB (kickoff 2026-06-27T23:30:00Z) → ~Jun 27, 9:45 PM EDT
    - cron: '15 4 28 6 *'  # ARG-JOR, ALG-AUT (kickoff 2026-06-28T02:00:00Z) → ~Jun 28, 12:15 AM EDT
    # Fallback: every 20 min during WC 2026 (Jun 11–30, Jul 1–19) if feed lags or cron missed
    - cron: '*/20 * 11-30 6 *'
    - cron: '*/20 * 1-19 7 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch feed and regenerate data
        run: node scripts/update-from-feed.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/playedMatches.js src/data/upcomingMatches.js src/data/groups.js
          if git diff --staged --quiet; then
            echo "No score changes — skipping commit"
          else
            git commit -m "chore: auto-update scores from openfootball feed"
            git push
          fi
